# A string used to distinguish different Supabase projects on the same host.
project_id = "samarthya-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8010"
additional_redirect_urls = ["http://localhost:8010/**", "http://127.0.0.1:8010/**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "52428800" # 50MiB
