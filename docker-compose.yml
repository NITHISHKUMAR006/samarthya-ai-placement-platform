services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./config.env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5190"
    ports:
      - "5190:5190"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5190/health')"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
        VITE_API_BASE_URL: ${API_BASE_URL}/api/v1
    ports:
      - "8010:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
